name: Build Midnight Club 3 RMX iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-ios.yml"
      - "mcdub3-nx-ios-v1.1.0.zip"

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mc3-source"
          unzip -q mcdub3-nx-ios-v1.1.0.zip -d "$RUNNER_TEMP/mc3-source"
          SOURCE_DIR="$RUNNER_TEMP/mc3-source/mcdub3-nx-ios-v1.1.0"
          test -f "$SOURCE_DIR/Makefile"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "MC3_WORK=$SOURCE_DIR/work-remix" >> "$GITHUB_ENV"

      - name: Verify Xcode
        run: |
          xcodebuild -version
          sudo xcodebuild -license accept

      - name: Install dependencies
        run: |
          brew install cmake ninja xcodegen
          python3 -m venv "$MC3_WORK/venv"
          "$MC3_WORK/venv/bin/python3" -m pip install --upgrade pip
          "$MC3_WORK/venv/bin/python3" -m pip install capstone pillow gdown

      - name: Download SDL2
        run: |
          mkdir -p "$MC3_WORK/tools"
          curl -L --fail \
            https://www.libsdl.org/release/SDL2-2.32.10.tar.gz \
            -o "$RUNNER_TEMP/SDL2.tar.gz"
          tar -xzf "$RUNNER_TEMP/SDL2.tar.gz" -C "$MC3_WORK/tools"

      - name: Download game image
        env:
          GDRIVE_FILE_ID: "1Eql0Jl38mS8PuYSkc0EWIsuKhLr2bZdU"
        shell: bash
        run: |
          set -euo pipefail

          "$MC3_WORK/venv/bin/python3" -m gdown \
            "$GDRIVE_FILE_ID" \
            -O "$RUNNER_TEMP/mc3-remix.iso"

          if [[ ! -s "$RUNNER_TEMP/mc3-remix.iso" ]]; then
            echo "::error::Game image download failed."
            exit 1
          fi

          file "$RUNNER_TEMP/mc3-remix.iso"

      - name: Extract game
        working-directory: ${{ env.SOURCE_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          make GAME=remix extract ISO="$RUNNER_TEMP/mc3-remix.iso"

          if [[ ! -f game-remix/default.xbe ]]; then
            echo "::error::Extraction completed, but game-remix/default.xbe was not found."
            find game-remix -maxdepth 3 -type f | head -50 || true
            exit 1
          fi

      - name: Lift Xbox executable into native C
        working-directory: ${{ env.SOURCE_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          make lift GAME=remix
      - name: Build unsigned ARM64 iOS app
        working-directory: ${{ env.SOURCE_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ios/Config

          cat > ios/Config/Local.xcconfig <<'EOF'
          DEVELOPMENT_TEAM =
          MC3_BUNDLE_PREFIX = com.example
          EOF

          export MC3_XCODEBUILD_ARGS="CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="

          make ios GAME=remix

      - name: Package unsigned IPA
        working-directory: ${{ env.SOURCE_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find "$MC3_WORK/ios" -type d -name '*.app' -path '*/iphoneos/*' -print -quit)"

          if [[ -z "$APP_PATH" ]]; then
            echo "::error::No compiled iOS app bundle was found."
            find "$MC3_WORK/ios" -maxdepth 6 -print || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload"

          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/$(basename "$APP_PATH")"

          (
            cd "$RUNNER_TEMP/ipa"
            /usr/bin/zip -qry \
              "$GITHUB_WORKSPACE/Midnight-Club-3-Remix-unsigned.ipa" Payload
          )

          test -s "$GITHUB_WORKSPACE/Midnight-Club-3-Remix-unsigned.ipa"

          ls -lh "$GITHUB_WORKSPACE/Midnight-Club-3-Remix-unsigned.ipa"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: Midnight-Club-3-Remix-iOS-unsigned
          path: Midnight-Club-3-Remix-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
