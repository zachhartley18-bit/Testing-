name: Build Midnight Club 3 Remix iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-ios.yml"
      - "mcdub3-nx-ios-v1.1.0.zip"

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mc3-source"
          unzip -q mcdub3-nx-ios-v1.1.0.zip -d "$RUNNER_TEMP/mc3-source"
          SOURCE_DIR="$RUNNER_TEMP/mc3-source/mcdub3-nx-ios-v1.1.0"
          test -f "$SOURCE_DIR/Makefile"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "MC3_WORK=$SOURCE_DIR/work-remix" >> "$GITHUB_ENV"

      - name: Verify Xcode
        run: |
          xcodebuild -version
          sudo xcodebuild -license accept

      - name: Install dependencies
        run: |
          brew install cmake ninja xcodegen
          python3 -m venv "$MC3_WORK/venv"
          "$MC3_WORK/venv/bin/python3" -m pip install --upgrade pip
          "$MC3_WORK/venv/bin/python3" -m pip install capstone pillow gdown

      - name: Download SDL2
        run: |
          mkdir -p "$MC3_WORK/tools"
          curl -L --fail \
            https://www.libsdl.org/release/SDL2-2.32.10.tar.gz \
            -o "$RUNNER_TEMP/SDL2.tar.gz"
          tar -xzf "$RUNNER_TEMP/SDL2.tar.gz" -C "$MC3_WORK/tools"

      - name: Download game image
        env:
          GDRIVE_FILE_ID: "114mOUG5HC3KOAm6v5LHqfLdEiF21VZBC"
        shell: bash
        run: |
          set -euo pipefail

          "$MC3_WORK/venv/bin/python3" -m gdown \
            "$GDRIVE_FILE_ID" \
            -O "$RUNNER_TEMP/mc3-remix.iso"

          if [[ ! -s "$RUNNER_TEMP/mc3-remix.iso" ]]; then
            echo "::error::Game image download failed or returned an empty file."
            exit 1
          fi

          file "$RUNNER_TEMP/mc3-remix.iso"

          if file "$RUNNER_TEMP/mc3-remix.iso" | grep -qiE 'HTML|text'; then
            echo "::error::Google Drive returned a webpage instead of the ISO."
            exit 1
          fi

      - name: Extract game
        working-directory: ${{ env.SOURCE_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          make GAME=remix extract ISO="$RUNNER_TEMP/mc3-remix.iso"

          if [[ ! -f game-remix/default.xbe ]]; then
            echo "::error::Extraction completed, but game-remix/default.xbe was not found."
            find game-remix -maxdepth 3 -type f | head -50 || true
            exit 1
          fi
