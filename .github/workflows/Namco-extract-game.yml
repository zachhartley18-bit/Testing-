name: Extract Namco Museum Game Files

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-game:
    name: Extract Namco Museum XISO
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git zip python3-venv

      - name: Install Google Drive downloader
        run: |
          python3 -m venv "$RUNNER_TEMP/gdown-venv"
          "$RUNNER_TEMP/gdown-venv/bin/python" -m pip install --upgrade pip gdown

      - name: Build extract-xiso
        run: |
          git clone --depth 1 https://github.com/XboxDev/extract-xiso.git "$RUNNER_TEMP/extract-xiso-src"
          cmake -S "$RUNNER_TEMP/extract-xiso-src" -B "$RUNNER_TEMP/extract-xiso-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/extract-xiso-build" --config Release --parallel 2

          EXTRACT_XISO="$(find "$RUNNER_TEMP/extract-xiso-build" -type f -name extract-xiso -perm -111 -print -quit)"

          if [ -z "$EXTRACT_XISO" ]; then
            echo "Could not find the extract-xiso executable after building."
            find "$RUNNER_TEMP/extract-xiso-build" -maxdepth 4 -type f -print
            exit 1
          fi

          echo "EXTRACT_XISO=$EXTRACT_XISO" >> "$GITHUB_ENV"

      - name: Download Namco Museum XISO
        run: |
          mkdir -p "$RUNNER_TEMP/namco/input"

          "$RUNNER_TEMP/gdown-venv/bin/gdown" "1mHlZ2hqkAexh89G46LNB0dpdgH2MaO11" -O "$RUNNER_TEMP/namco/input/namco-museum.xiso.iso"

          if [ ! -s "$RUNNER_TEMP/namco/input/namco-museum.xiso.iso" ]; then
            echo "The Namco Museum XISO download is missing or empty."
            exit 1
          fi

      - name: Extract game files
        run: |
          mkdir -p "$RUNNER_TEMP/namco/game"

          "$EXTRACT_XISO" "$RUNNER_TEMP/namco/input/namco-museum.xiso.iso" -d "$RUNNER_TEMP/namco/game"

          if [ ! -f "$RUNNER_TEMP/namco/game/default.xbe" ]; then
            echo "Extraction finished, but default.xbe was not found at the expected location."
            echo "Extracted files:"
            find "$RUNNER_TEMP/namco/game" -maxdepth 3 -type f | head -200
            exit 1
          fi

      - name: Package extracted game files
        run: |
          cd "$RUNNER_TEMP/namco"
          zip -qr "$GITHUB_WORKSPACE/NamcoMuseum-Extracted-Game-Files.zip" game
          test -s "$GITHUB_WORKSPACE/NamcoMuseum-Extracted-Game-Files.zip"

      - name: Upload extracted game files
        uses: actions/upload-artifact@v4
        with:
          name: NamcoMuseum-Extracted-Game-Files
          path: NamcoMuseum-Extracted-Game-Files.zip
          if-no-files-found: error
          retention-days: 3
