name: Namco Museum iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/namco-ios-build.yml'
      - 'Testing-Namco-Merged-Source.zip'

permissions:
  contents: read

concurrency:
  group: namco-ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build and package unsigned Namco Museum IPA
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      GAME: namco
      JOBS: '2'
      MC3_XCODE_CONFIGURATION: Release
      MC3_XCODEBUILD_ARGS: 'CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='
      MC3_BUILD_ID: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate or extract the merged Namco project
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "$GITHUB_WORKSPACE/Makefile" && \
                -f "$GITHUB_WORKSPACE/tools/ios_build.sh" && \
                -f "$GITHUB_WORKSPACE/config/namco/game.env" ]]; then
            SOURCE_DIR="$GITHUB_WORKSPACE"
          elif [[ -f "$GITHUB_WORKSPACE/Testing-Namco-Merged-Source.zip" ]]; then
            SOURCE_DIR="$RUNNER_TEMP/namco-source"
            rm -rf "$SOURCE_DIR"
            mkdir -p "$SOURCE_DIR"
            unzip -tq "$GITHUB_WORKSPACE/Testing-Namco-Merged-Source.zip"
            unzip -q "$GITHUB_WORKSPACE/Testing-Namco-Merged-Source.zip" -d "$SOURCE_DIR"
          else
            echo "::error::Could not find the expanded project or Testing-Namco-Merged-Source.zip."
            exit 1
          fi

          for required in Makefile tools/ios_build.sh tools/env.sh ios/CMakeLists.txt \
                          ios/project.yml CMakeLists.txt config/namco/game.env \
                          config/namco/app.env config/namco/xbe_facts.h \
                          src/games/namco/recomp_manual.c namco/generated/recomp_types.h \
                          namco/generated/recomp_funcs.h namco/generated/recomp_dispatch.c; do
            [[ -f "$SOURCE_DIR/$required" ]] || {
              echo "::error::Missing required project file: $required"
              exit 1
            }
          done

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "Located project at: $SOURCE_DIR"

      - name: Verify Xcode and install missing build tools
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

          command -v cmake >/dev/null 2>&1 || brew install cmake
          command -v ninja >/dev/null 2>&1 || brew install ninja
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

          cmake --version
          ninja --version
          xcodegen --version

      - name: Prepare SDL2 source required by the existing MC3 iOS builder
        shell: bash
        run: |
          set -euo pipefail
          SDL_DIR="$RUNNER_TEMP/SDL2-2.32.10"
          rm -rf "$SDL_DIR"
          git clone --depth 1 --branch release-2.32.10 \
            https://github.com/libsdl-org/SDL.git "$SDL_DIR"
          test -f "$SDL_DIR/CMakeLists.txt"
          echo "MC3_SDL_DIR=$SDL_DIR" >> "$GITHUB_ENV"

      - name: Stage and verify the existing Namco generated code
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          CHUNK_COUNT=$(find namco/generated -maxdepth 1 \
            -type f -name 'recomp_[0-9][0-9][0-9][0-9].c' | wc -l | tr -d ' ')
          [[ "$CHUNK_COUNT" == "23" ]] || {
            echo "::error::Expected 23 generated Namco C chunks; found $CHUNK_COUNT."
            exit 1
          }

          rm -rf work-namco/gen
          mkdir -p work-namco/gen
          cp -R namco/generated/. work-namco/gen/

          test -s work-namco/gen/recomp_types.h
          test -s work-namco/gen/recomp_funcs.h
          test -s work-namco/gen/recomp_dispatch.c
          test -s work-namco/gen/recomp_stubs_unresolved.c

          echo "Namco generated chunks: $CHUNK_COUNT"
          echo "Generated source size: $(du -sh work-namco/gen | awk '{print $1}')"
          echo "MC3 game selection: $GAME"
          echo "Namco work directory: $SOURCE_DIR/work-namco"

      - name: Build the existing MC3 iOS device app for Namco
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          make ios GAME=namco JOBS=2

      - name: Validate app and package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          APP="$SOURCE_DIR/work-namco/ios/iphoneos/Namco Museum.app"
          [[ -d "$APP" ]] || {
            echo "::error::The iOS builder did not produce the expected app: $APP"
            find "$SOURCE_DIR/work-namco/ios/iphoneos" -maxdepth 4 -print 2>/dev/null || true
            exit 1
          }

          INFO="$APP/Info.plist"
          [[ -s "$INFO" ]]
          plutil -lint "$INFO"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO")
          [[ -n "$BUNDLE_ID" && -n "$EXECUTABLE" ]]
          [[ -f "$APP/$EXECUTABLE" ]]
          ARCHS=$(lipo -archs "$APP/$EXECUTABLE")
          [[ " $ARCHS " == *" arm64 "* ]] || {
            echo "::error::Expected an arm64 iOS executable; found: $ARCHS"
            exit 1
          }

          rm -rf "$RUNNER_TEMP/namco-ipa-package" "$GITHUB_WORKSPACE/Payload" \
            "$GITHUB_WORKSPACE/NamcoMuseum.ipa" "$GITHUB_WORKSPACE/NamcoMuseum.ipa.sha256"
          mkdir -p "$RUNNER_TEMP/namco-ipa-package/Payload"
          ditto "$APP" "$RUNNER_TEMP/namco-ipa-package/Payload/Namco Museum.app"
          (cd "$RUNNER_TEMP/namco-ipa-package" && \
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/NamcoMuseum.ipa" Payload)

          test -s "$GITHUB_WORKSPACE/NamcoMuseum.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/NamcoMuseum.ipa" \
            | tee "$GITHUB_WORKSPACE/NamcoMuseum.ipa.sha256"

          {
            echo "## Namco Museum unsigned iOS package"
            echo
            echo "- Bundle identifier: \\`$BUNDLE_ID\\`"
            echo "- Executable architecture(s): \\`$ARCHS\\`"
            echo "- IPA size: $(du -h "$GITHUB_WORKSPACE/NamcoMuseum.ipa" | awk '{print $1}')"
            echo "- Signing: disabled; ready for your own signing workflow"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: namco-museum-unsigned-ipa-${{ github.run_number }}
          path: |
            NamcoMuseum.ipa
            NamcoMuseum.ipa.sha256
            ${{ runner.temp }}/namco-ipa-package/**
            ${{ env.SOURCE_DIR }}/work-namco/logs/**
            ${{ env.SOURCE_DIR }}/work-namco/ios/iphoneos/xcode/Logs/Build/**
          if-no-files-found: warn
          retention-days: 30
