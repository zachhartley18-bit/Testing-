name: Namco Museum iOS - Runtime Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namco-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google Drive downloader
        run: python -m pip install --upgrade gdown

      # ==========================================
      # DOWNLOAD EXISTING NAMCO RECOMPILED FILES
      # ==========================================

      - name: Download Namco generated-C archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$RUNNER_TEMP/namco-results.zip"
          ROOT="$RUNNER_TEMP/namco-artifact"

          mkdir -p "$ROOT"

          gdown --fuzzy \
            "https://drive.google.com/file/d/1nKL3QkzTf4NBoa3giCOWYC4P3jgkolMX/view?usp=drivesdk" \
            -O "$ARCHIVE"

          if [[ ! -s "$ARCHIVE" ]]; then
            echo "::error::Google Drive download was empty."
            exit 1
          fi

          if file "$ARCHIVE" | grep -qiE 'HTML|text'; then
            echo "::error::Google Drive returned a webpage instead of the ZIP."
            echo "Check Google Drive sharing permissions."
            exit 1
          fi

          if ! unzip -tq "$ARCHIVE"; then
            echo "::error::Downloaded file is not a valid ZIP archive."
            exit 1
          fi

          unzip -q "$ARCHIVE" -d "$ROOT"

          rm -f "$ARCHIVE"

          echo "Namco archive downloaded successfully."

          echo "Archive contents:"
          find "$ROOT" -type f | head -100

      # ==========================================
      # VALIDATE GENERATED C SOURCE
      # ==========================================

      - name: Validate generated sources
        id: inputs
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$RUNNER_TEMP/namco-artifact"
          REPORT="$RUNNER_TEMP/namco-preflight"

          mkdir -p "$REPORT"

          echo "## Downloaded Namco archive inventory" \
            | tee "$REPORT/preflight.md"

          python3 - "$ROOT" "$REPORT/artifact-files.txt" <<'PY'
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          output = Path(sys.argv[2])

          rows = []

          for path in sorted(p for p in root.rglob("*") if p.is_file()):
              rows.append(
                  f"{path.relative_to(root)}\t{path.stat().st_size} bytes"
              )

          output.write_text(
              "\n".join(rows) + "\n",
              encoding="utf-8"
          )
          PY

          cat "$REPORT/artifact-files.txt" \
            | tee -a "$REPORT/preflight.md"

          FUNCS="$(find "$ROOT" -name recomp_funcs.h -print -quit)"
          TYPES="$(find "$ROOT" -name recomp_types.h -print -quit)"
          DISPATCH="$(find "$ROOT" -name recomp_dispatch.c -print -quit)"
          XBE="$(find "$ROOT" -iname default.xbe -print -quit)"
          COMMIT_FILE="$(find "$ROOT" -name xboxrecomp-commit.txt -print -quit)"

          for item in FUNCS TYPES DISPATCH XBE COMMIT_FILE; do
            if [[ -z "${!item}" || ! -s "${!item}" ]]; then
              echo "::error::Required component is missing: $item"
              exit 1
            fi
          done

          RUNTIME_COMMIT="$(tr -d '[:space:]' < "$COMMIT_FILE")"

          if [[ ! "$RUNTIME_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid XboxRecomp commit: $RUNTIME_COMMIT"
            exit 1
          fi

          GENERATED_C_COUNT="$(
            find "$ROOT" -type f -name 'recomp_*.c' | wc -l | tr -d ' '
          )"

          if [[ "$GENERATED_C_COUNT" -eq 0 ]]; then
            echo "::error::No generated C files were found."
            exit 1
          fi

          echo "runtime_commit=$RUNTIME_COMMIT" >> "$GITHUB_OUTPUT"

          echo "generated_c_count=$GENERATED_C_COUNT" \
            >> "$GITHUB_OUTPUT"

          {
            echo
            echo "### Required inputs"
            echo "- Generated function declarations: present"
            echo "- Generated type definitions: present"
            echo "- Generated dispatch source: present"
            echo "- Original XBE: present"
            echo "- Generated C files: $GENERATED_C_COUNT"
            echo "- XboxRecomp commit: \`$RUNTIME_COMMIT\`"
          } | tee -a "$REPORT/preflight.md"

          cat "$REPORT/preflight.md" >> "$GITHUB_STEP_SUMMARY"

      # ==========================================
      # RESTORE EXACT XBOXRECOMP VERSION
      # ==========================================

      - name: Check out exact XboxRecomp revision
        shell: bash
        run: |
          set -euo pipefail

          git init "$RUNNER_TEMP/xboxrecomp"

          git -C "$RUNNER_TEMP/xboxrecomp" remote add origin \
            https://github.com/sp00nznet/xboxrecomp.git

          git -C "$RUNNER_TEMP/xboxrecomp" fetch \
            --depth 1 origin \
            "${{ steps.inputs.outputs.runtime_commit }}"

          git -C "$RUNNER_TEMP/xboxrecomp" checkout --detach FETCH_HEAD

          ACTUAL_COMMIT="$(
            git -C "$RUNNER_TEMP/xboxrecomp" rev-parse HEAD
          )"

          if [[ "$ACTUAL_COMMIT" != "${{ steps.inputs.outputs.runtime_commit }}" ]]; then
            echo "::error::XboxRecomp revision mismatch."
            exit 1
          fi

          echo "Correct XboxRecomp revision restored."

      # ==========================================
      # AUDIT IOS / GRAPHICS COMPATIBILITY
      # ==========================================

      - name: Audit runtime platform and renderer
        shell: bash
        run: |
          set -euo pipefail

          RUNTIME="$RUNNER_TEMP/xboxrecomp"
          REPORT="$RUNNER_TEMP/namco-preflight"

          {
            echo
            echo "## Runtime platform audit"

            echo "- Runtime commit: \`$(git -C "$RUNTIME" rev-parse HEAD)\`"

            echo
            echo "### iOS-related CMake configuration"

            grep -RInE 'IOS|iOS|CMAKE_SYSTEM_NAME' \
              "$RUNTIME/CMakeLists.txt" "$RUNTIME/src" \
              --include='CMakeLists.txt' \
              --include='*.cmake' || true

            echo
            echo "### Renderer implementation files"

            find "$RUNTIME/src" -type f \
              \( \
                -iname '*metal*' \
                -o -iname '*vulkan*' \
                -o -iname '*gl*' \
                -o -iname '*present*' \
              \) -print | sort

            echo
            echo "### Generated Namco C source count"

            find "$RUNNER_TEMP/namco-artifact" \
              -type f -name 'recomp_*.c' | wc -l

            echo
            echo "### Renderer references in CMake"

            grep -RInE \
              'OpenGL|OpenGLES|Metal|Vulkan|nv2a_gl|nv2a_vk' \
              "$RUNTIME/CMakeLists.txt" "$RUNTIME/src" \
              --include='CMakeLists.txt' \
              --include='*.cmake' || true

          } | tee "$REPORT/runtime-audit.txt" \
            >> "$REPORT/preflight.md"

          cat "$REPORT/runtime-audit.txt" \
            >> "$GITHUB_STEP_SUMMARY"

      # ==========================================
      # REPORT GRAPHICS READINESS
      # ==========================================

      - name: Report iOS renderer readiness
        shell: bash
        run: |
          set -euo pipefail

          RUNTIME="$RUNNER_TEMP/xboxrecomp"

          if find "$RUNTIME/src" -type f \
            -iname '*metal*' | grep -q .; then

            echo "Metal-related source files exist."
            echo "They still require compatibility and CMake integration review."

          else

            echo "::warning::This XboxRecomp revision has no Metal renderer source files."

            echo "A UIKit/SDL shell or Metal drawable alone cannot execute"
            echo "the Xbox NV2A/D3D8 graphics path."

          fi

          echo "::notice::Existing Namco generated C files were downloaded and validated."

          echo "::notice::This workflow is currently a runtime preflight, not an IPA build."

      # ==========================================
      # SAVE AUDIT RESULTS
      # ==========================================

      - name: Upload preflight report and source manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: namco-ios-preflight
          path: |
            ${{ runner.temp }}/namco-preflight/
            ${{ runner.temp }}/namco-artifact/
          if-no-files-found: warn
          retention-days: 14
